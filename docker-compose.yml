# One command: docker compose up --build
# Data stays in this compose project. Nothing phones home.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentboard
      POSTGRES_PASSWORD: agentboard
      POSTGRES_DB: agentboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentboard -d agentboard"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: ghcr.io/ustoppble/overclick:latest
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://agentboard:agentboard@postgres:5432/agentboard
      AUTH_SECRET: local-dev-only-change-me-32chars-min
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      UPDATE_TRIGGER_DIR: /update-trigger
    volumes:
      - update-trigger:/update-trigger
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Optional one-click updater. Enable with:
  #   docker compose --profile updater up -d
  # It watches for the trigger file the Update button writes, then pulls the
  # new image and recreates the app. It needs the docker socket, which is why
  # it stays behind an explicit profile. Without it the Update button shows
  # the copy-paste command instead.
  updater:
    image: docker:27-cli
    profiles: ["updater"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - update-trigger:/trigger
      - ./:/workspace
    working_dir: /workspace
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          if [ -f /trigger/update-requested ]; then
            rm -f /trigger/update-requested
            docker compose pull app && docker compose up -d app
          fi
          sleep 5
        done
    restart: unless-stopped

volumes:
  pgdata:
  update-trigger:
