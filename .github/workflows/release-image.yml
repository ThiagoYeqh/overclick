# Publishes a versioned image to ghcr.io on every v* tag push. This powers the
# opt-in self-update flow: instances that enable the update check compare their
# version against the latest GitHub Release and pull this image.
name: release-image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tag never diverges from the manifests it publishes: OCL-73 turned
      # yesterday's incident (a tag pushed without a version bump, so the
      # deployed instance's own APP_VERSION read as older than the release it
      # already ran) into a release-time failure instead of a runtime banner.
      - run: scripts/verify-release-version.sh

  publish:
    needs: [verify, verify-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
